name: Bootstrap

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Create package metadata
        run: |
          cat > package.json <<'JSON'
          {
            "name": "@ankhorage/maps",
            "version": "0.0.0",
            "description": "Cross-platform map primitives and adapters for Ankhorage.",
            "license": "MIT",
            "type": "module",
            "sideEffects": false,
            "repository": {
              "type": "git",
              "url": "git+https://github.com/ankhorage/maps.git"
            },
            "homepage": "https://github.com/ankhorage/maps#readme",
            "bugs": {
              "url": "https://github.com/ankhorage/maps/issues"
            },
            "publishConfig": {
              "access": "public"
            },
            "engines": {
              "node": ">=24"
            },
            "scripts": {
              "build": "rm -rf dist tsconfig.tsbuildinfo tsconfig.build.tsbuildinfo && bun x tsc -p tsconfig.build.json",
              "check-types": "bun x tsc --noEmit -p tsconfig.json",
              "typecheck": "bun run check-types",
              "test": "bun test"
            },
            "packageManager": "bun@1.4.2"
          }
          JSON
          mkdir -p .changeset
          cat > .changeset/config.json <<'JSON'
          {
            "$schema": "https://unpkg.com/@changesets/config@3.1.4/schema.json",
            "changelog": "@changesets/cli/changelog",
            "commit": false,
            "fixed": [],
            "linked": [],
            "access": "public",
            "baseBranch": "main",
            "updateInternalDependencies": "patch",
            "ignore": []
          }
          JSON

      - name: Install Devtools
        run: bun add -D @ankhorage/devtools

      - name: Synchronize repository with Devtools provider
        run: |
          bun - <<'TS'
          import provider from '@ankhorage/devtools/cli';

          const handler = provider.handlers.find(
            ({ path }) => path.length === 1 && path[0] === 'sync',
          );

          if (!handler) {
            throw new Error('Devtools sync handler not found.');
          }

          const result = await handler.handler({
            argv: ['.'],
            context: {
              cwd: process.cwd(),
              env: process.env,
              writeStdout: (value) => process.stdout.write(value),
              writeStderr: (value) => process.stderr.write(value),
            },
          });

          process.exitCode = result.exitCode;
          TS

      - name: Remove bootstrap workflow
        run: rm .github/workflows/bootstrap.yml

      - name: Commit synchronized repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: bootstrap repository with devtools"
          git push
