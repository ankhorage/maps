name: Task Validation

on:
  push:
    branches:
      - feat/maps-adapter-contract

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: bun install
      - run: bun run build
      - run: bun run check-types
      - run: bun run lint
      - run: bun run knip:check
      - run: bun run changeset:status
      - run: bun run format
      - run: bun run test
      - name: Generate release documentation for validation
        run: bun run docs
      - name: Seed initial Changesets changelog for validation
        run: printf '# @ankhorage/maps\n' > CHANGELOG.md
      - name: Upload generated bootstrap documentation
        uses: actions/upload-artifact@v4
        with:
          name: maps-bootstrap-docs
          path: |
            README.md
            paradox/
      - name: Validate repository
        run: BUN_INSTALL_CACHE_DIR="${RUNNER_TEMP}/doctor-cache" bunx @ankhorage/doctor@0.12.16 validate .

      - name: Commit synchronized lockfile
        run: |
          git add bun.lock
          if git diff --cached --quiet; then
            echo "Lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: synchronize maps package lockfile"
          git push
